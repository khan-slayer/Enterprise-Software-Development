global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'bookstore-replicas'
    honor_labels: true
    static_configs:
      - targets: ['bookstore-app-1:8000']
        labels:
          replica: 'A'
      - targets: ['bookstore-app-2:8000']
        labels:
          replica: 'B'
      - targets: ['bookstore-app-3:8000']
        labels:
          replica: 'C'

  - job_name: 'envoy'
    metrics_path: '/stats/prometheus'
    static_configs:
      - targets: ['envoy:9901']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
