global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'bookstore-api'
    static_configs:
      - targets: ['api:8000']
  - job_name: 'bookstore-grpc'
    static_configs:
      - targets: ['grpc-service:8001']
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
